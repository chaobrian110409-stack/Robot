<style>
:root{--bg:#09090B;--sf:#121316;--s2:#111114;--bd:rgba(255,255,255,.08);--tx:#A1A1AA;--hd:#FAFAFA;--ac:#7C9CFF;--on:#09090B;--ok:#34D399;--no:#F87171;--ease:cubic-bezier(.16,1,.3,1)}
[data-theme=light]{--bg:#F7F7F8;--sf:#FFFFFF;--s2:#F1F1F3;--bd:rgba(0,0,0,.12);--tx:#52525B;--hd:#09090B;--ac:#2F54D6;--on:#FFFFFF;--ok:#047857;--no:#B91C1C}

body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.7 Inter,'Noto Sans TC',system-ui,sans-serif;background:radial-gradient(900px 420px at 85% -10%,color-mix(in srgb,var(--ac) 16%,transparent),transparent),var(--bg)}

canvas{width:100%;height:auto;display:block;background:var(--s2);border:1px solid var(--bd);border-radius:12px;touch-action:none}

.tag{display:inline-block;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid}.t0{color:#F59E0B;border-color:#F59E0B}.t1{color:var(--ac);border-color:var(--ac)}.hl{background:color-mix(in srgb,var(--no) 20%,transparent);color:var(--hd);padding:0 4px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const F=x=>isFinite(x)?String(+(+x).toPrecision(4)):'—';
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const pick=a=>a[Math.random()*a.length|0];
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const R=(f,s,a,m,sw,svg)=>({f,s,a,m,sw,svg});
const deg=Math.PI/180;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* 主題與分頁 */
$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('phy_theme',t)}catch(e){}};
$$('#tabs button').forEach(b=>b.onclick=()=>{$$('#tabs button').forEach(x=>x.classList.toggle('on',x===b));$$('.sec').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t))});

/* 顏色資料：以 R=4 G=2 B=1 的位元遮罩表示 */
const CN=['黑色','藍色','綠色','青色','紅色','品紅色','黃色','白色'],CH=['#000000','#0000FF','#00FF00','#00FFFF','#FF0000','#FF00FF','#FFFF00','#FFFFFF'];

/* 透鏡成像判讀（正負號：q>0 為異側實像） */
function lens(type,f,p){
 const cv=type==='convex';
 if(cv&&Math.abs(p-f)<1e-9)return{none:true,items:['p = f：出射光為平行光，不成像（像在無窮遠）'],mv:'—'};
 const fs=cv?f:-f,q=p*fs/(p-fs),m=-q/p,real=q>0;
 let reg;
 if(!cv)reg='凹透鏡：任意物距';else if(p>2*f+1e-9)reg='p > 2f';else if(Math.abs(p-2*f)<1e-9)reg='p = 2f';else if(p>f)reg='f < p < 2f';else reg='p < f';
 const am=Math.abs(m),size=Math.abs(am-1)<1e-9?'等大':am>1?'放大':'縮小';
 const items=[`區間：${reg}`,`${real?'倒立':'正立'}、${size}、${real?'實像':'虛像'}`,`像在透鏡${real?'異側（物體對面）':'同側（與物體同側）'}，|q| = ${F(Math.abs(q))}，|m| = ${F(am)}`];
 const mv=!cv?'物體靠近透鏡 → 像靠近透鏡、變大（仍是縮小正立虛像）':p>f?'物體靠近透鏡 → 像遠離透鏡、變大':'物體靠近透鏡 → 虛像靠近透鏡、變小';
 return{q,m,real,items,mv,fs};
}

/* 題型定義 */
/* 回聲路徑示意圖：A 發聲、B 聽到回聲、C 障礙物 */
function dia(d0,d1,vt,ut){
 const s=360/Math.max(d0,d1),C=440,A=C-s*d0,B=C-s*d1,mid=(a,b)=>(a+b)/2;
 const L=(x1,y,x2,c,m)=>`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" style="stroke:${c}" stroke-width="2.5" marker-end="url(#${m})"/>`;
 const M=(id,c)=>`<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:${c}"/></marker>`;
 const X=(x,y,c,t,a)=>`<text x="${x}" y="${y}" style="fill:${c}" font-size="12" text-anchor="${a||'middle'}">${t}</text>`;
 const g='#34D399',o='#F59E0B',b='var(--ac)',tx='var(--tx)';
 return `<svg viewBox="0 0 480 150" style="width:100%;height:auto;margin-bottom:8px"><defs>${M('mg',g)}${M('mo',o)}${M('mb',b)}</defs>
 <rect x="${C}" y="38" width="10" height="92" style="fill:${tx}"/>
 <line x1="${A}" y1="40" x2="${A}" y2="130" style="stroke:${tx}" stroke-dasharray="3 4"/><line x1="${B}" y1="40" x2="${B}" y2="130" style="stroke:${tx}" stroke-dasharray="3 4"/>
 ${X(6,14,o,'聲音總路程 v聲·t = '+F(vt)+' m（去程 d₀ + 回程 d₁）','start')}${X(6,30,g,'物體位移 v物·t = '+F(ut)+' m','start')}
 ${L(A,56,B,g,'mg')}${L(A,86,C,o,'mo')}${L(C,112,B,b,'mb')}
 ${X(mid(A,C),80,o,'去程 d₀ = '+F(d0)+' m')}${X(mid(B,C),126,b,'回程 d₁ = '+F(d1)+' m')}
 ${X(A,144,tx,'A 發聲',A<=B?'end':'start')}${X(B,144,tx,'B 聽到回聲',A<=B?'start':'end')}${X(478,144,tx,'C 障礙物','end')}</svg>`}

const LC=[['cm',1],['m',100]],LM=[['m',1],['cm',.01]],TS=[['s',1],['ms',.001]];
const T=[
{cat:'w',title:'1 波形判讀與換算',kw:'波長 週期 頻率 波速 振幅 橫波 縱波',
 fields:[{k:'d',l:'總距離',un:LM},{k:'n',l:'波數（個）'},{k:'t',l:'經歷時間',un:TS},{k:'A',l:'振幅',un:LM}],
 ex:{d:12,n:3,t:6,A:.05},
 calc(g){const d=g('d','總距離'),n=g('n','波數'),t=g('t','經歷時間'),A=g('A','振幅'),L=d/n,P=t/n,f=n/t,v=f*L;
  return R('λ = 總距離 ÷ 波數；T = 時間 ÷ 波數；f = 1 ÷ T；v = fλ',[`（已換算為 m、s）`,`λ = ${F(d)} ÷ ${F(n)} = ${F(L)} m`,`T = ${F(t)} ÷ ${F(n)} = ${F(P)} s`,`f = 1 ÷ ${F(P)} = ${F(f)} Hz`,`v = ${F(f)} × ${F(L)} = ${F(v)} m/s`],`λ = ${F(L)} m、A = ${F(A)} m、T = ${F(P)} s、f = ${F(f)} Hz、v = ${F(v)} m/s`,'振幅是離平衡位置的最大位移，不是波峰到波谷；波速等於每秒波前進的距離。')},
 extra:'<table><tr><th></th><th>橫波</th><th>縱波</th></tr><tr><td>振動方向</td><td>垂直傳播方向</td><td>平行傳播方向</td></tr><tr><td>構造</td><td>波峰、波谷</td><td>疏部、密部</td></tr><tr><td>例子</td><td>繩波、水波、光</td><td>聲波、彈簧推拉波</td></tr></table>',
 talk:'把波想成「人浪」：每個人只是站起來又坐下（質點原地振動），但波形一路往前跑。數一數一秒有幾個波經過，就是頻率。',
 pit:'① 把「波峰到波谷」當成一個波長（其實是半個）。② 波數要數「完整波形」個數。③ 振幅不是峰到谷的高度。④ 單位 cm、ms 要先換成 m、s。'},
{cat:'w',title:'2 週期、頻率與波速反推',kw:'週期 頻率 波速 波長 v=fλ',
 fields:[{k:'mode',l:'求解項目',sel:[['v','求波速 v'],['f','求頻率 f（用 v、λ）'],['l','求波長 λ'],['Tf','由週期 T 求頻率 f'],['fT','由頻率 f 求週期 T']]},{k:'f',l:'頻率 f（Hz）',m:'v,l,fT'},{k:'T',l:'週期 T（s）',m:'Tf'},{k:'l',l:'波長 λ',un:LM,m:'v,f'},{k:'v',l:'波速 v（m/s）',m:'f,l'}],
 ex:{mode:'v',f:5,l:2},
 calc(g,m){
  if(m==='v'){const f=g('f','頻率'),L=g('l','波長'),v=f*L;return R('v = fλ',[`v = ${F(f)} × ${F(L)} = ${F(v)}`],`v = ${F(v)} m/s`,'波速取決於介質，不取決於頻率。')}
  if(m==='f'){const v=g('v','波速'),L=g('l','波長'),f=v/L;return R('f = v ÷ λ',[`f = ${F(v)} ÷ ${F(L)} = ${F(f)}`],`f = ${F(f)} Hz`,'介質不變時，波長越長，頻率越小。')}
  if(m==='l'){const v=g('v','波速'),f=g('f','頻率'),L=v/f;return R('λ = v ÷ f',[`λ = ${F(v)} ÷ ${F(f)} = ${F(L)}`],`λ = ${F(L)} m`,'波從一種介質進入另一種：f 不變，v 與 λ 同比例改變。')}
  if(m==='Tf'){const T=g('T','週期'),f=1/T;return R('f = 1 ÷ T',[`f = 1 ÷ ${F(T)} = ${F(f)}`],`f = ${F(f)} Hz`,'週期是一次振動的時間。')}
  const f=g('f','頻率'),T=1/f;return R('T = 1 ÷ f',[`T = 1 ÷ ${F(f)} = ${F(T)}`],`T = ${F(T)} s`,'頻率越高，週期越短。')},
 talk:'頻率是「一秒擺幾下」，週期是「擺一下要幾秒」，兩者互為倒數。v = fλ 像走路：步頻 × 步長 = 速度。',
 pit:'① 把 f = 1/T 誤寫成 f = T。② 波換介質時誤以為頻率會變（頻率由波源決定）。③ 單位忘了換成 m。'},
{cat:'w',title:'3 聲速與回聲測距',kw:'聲速 回聲 氣溫 距離 船 蝙蝠 聲納 移動 懸崖 超音波',
 fields:[{k:'mode',l:'情境／求解目標',sel:[['still','靜止回聲測距'],['mD','移動物體：求距離 d₀、d₁'],['mV','移動物體：求物體速度'],['mT','移動物體：求回聲時間'],['mB','雙次發聲測速（蝙蝠／聲納）'],['two','兩側障礙物雙回聲']]},
 {k:'dir',l:'移動方向',sel:[['a','朝向障礙物前進'],['f','遠離障礙物移動']],m:'mD,mV,mT,mB'},
 {k:'vs',l:'聲速 v聲（m/s，可留空改用氣溫）'},{k:'temp',l:'氣溫（℃，未填聲速時使用）'},
 {k:'u',l:'物體速度 v物（m/s）',m:'mD,mT'},
 {k:'t',l:'回聲時間 t（雙次發聲／雙回聲時為 t₁）',un:TS,m:'still,two,mD,mV,mB'},
 {k:'t2',l:'第二次回聲時間 t₂',un:TS,m:'two,mB'},
 {k:'tg',l:'兩次發聲間隔 Δt',un:TS,m:'mB'},
 {k:'d0',l:'發聲瞬間距離 d₀（m）',m:'mV,mT'},{k:'d1',l:'聽到回聲瞬間距離 d₁（m，求速度時可改填此項）',m:'mV'}],
 ex:{mode:'mD',dir:'a',temp:15,u:10,t:4},
 exs:[{n:'船隻鳴笛駛向懸崖',v:{mode:'mD',dir:'a',temp:15,u:10,t:4}},{n:'蝙蝠發射超音波避障',v:{mode:'mB',dir:'a',vs:340,tg:.9,t:.2,t2:.1}},{n:'車輛遠離山壁鳴笛',v:{mode:'mD',dir:'f',temp:15,u:20,t:2}}],
 calc(g,m){
  const vs=g('vs','聲速','opt');let v,sv;
  if(vs!==null){v=vs;sv=`v聲 = ${F(v)} m/s`}else{const tp=g('temp','氣溫（或聲速，請擇一輸入）','neg');v=331+.6*tp;if(v<=0)throw Error('氣溫過低，聲速不合理');sv=`v聲 = 331 + 0.6 × ${F(tp)} = ${F(v)} m/s`}
  if(m==='still'){const t=g('t','回聲時間'),d=v*t/2;return R('d = v聲 × t ÷ 2',[sv,`d = ${F(v)} × ${F(t)} ÷ 2 = ${F(d)} m`],`距離 d = ${F(d)} m`,'聲音來回走了兩趟，所以要除以 2。')}
  if(m==='two'){const t1=g('t','第一次回聲'),t2=g('t2','第二次回聲'),D=v*(t1+t2)/2;return R('兩牆距離 D = v聲(t₁ + t₂) ÷ 2',[sv,`D = ${F(v)} × (${F(t1)} + ${F(t2)}) ÷ 2 = ${F(D)} m`],`兩障礙物相距 D = ${F(D)} m`,'兩個單程距離相加就是兩牆間距。')}
  const ap=g('dir')==='a',k0=ap?'+':'−',k1=ap?'−':'+';
  const chk=u=>{if(u>=v)throw Error(`v物 = ${F(u)} m/s 已不小於聲速 ${F(v)} m/s：${ap?'物體會比聲音先（或同時）撞上障礙物':'聲音永遠追不上遠離的物體'}，無法依常規收到回聲。請檢查數值或單位。`)};
  const calcD=(u,t)=>[((ap?v+u:v-u)*t)/2,((ap?v-u:v+u)*t)/2];
  const tags=(a,b)=>`<span class="tag t0">發聲瞬間 d₀</span> ${F(a)} m　<span class="tag t1">聽到回聲瞬間 d₁</span> ${F(b)} m`;
  const why=ap?'朝向時，聲音與物體「面對面」合走：聲音路程 + 物體位移 = 2d₀。':'遠離時，聲音要「追」物體：聲音路程 − 物體位移 = 2d₀。';
  if(m==='mD'){const u=g('u','物體速度 v物','zero'),t=g('t','回聲時間');chk(u);const[d0,d1]=calcD(u,t);if(d0<=0||d1<=0)throw Error('算出的距離 ≤ 0，物理上不合理，請檢查數值');
   return R(`d₀ = (v聲 ${k0} v物)t ÷ 2；d₁ = (v聲 ${k1} v物)t ÷ 2`,[sv,`聲音總路程 = v聲·t = ${F(v)} × ${F(t)} = ${F(v*t)} m`,`物體位移 = v物·t = ${F(u)} × ${F(t)} = ${F(u*t)} m`,`d₀ = (${F(v)} ${k0} ${F(u)}) × ${F(t)} ÷ 2 = ${F(d0)} m`,`d₁ = (${F(v)} ${k1} ${F(u)}) × ${F(t)} ÷ 2 = ${F(d1)} m`],tags(d0,d1),why,null,dia(d0,d1,v*t,u*t))}
  if(m==='mV'){const t=g('t','回聲時間'),x0=g('d0','d₀','opt'),x1=g('d1','d₁','opt');if(x0===null&&x1===null)throw Error('請輸入 d₀ 或 d₁ 其中一項');
   const useD0=x0!==null,x=useD0?x0:x1;
   const u=useD0?(ap?2*x/t-v:v-2*x/t):(ap?v-2*x/t:2*x/t-v);
   if(u<0)throw Error('算出的物體速度為負值，與所選「朝向／遠離」方向不符，請檢查方向或數值');chk(u);
   const f=useD0?(ap?'d₀ = (v聲 + v物)t ÷ 2 → v物 = 2d₀ ÷ t − v聲':'d₀ = (v聲 − v物)t ÷ 2 → v物 = v聲 − 2d₀ ÷ t'):(ap?'d₁ = (v聲 − v物)t ÷ 2 → v物 = v聲 − 2d₁ ÷ t':'d₁ = (v聲 + v物)t ÷ 2 → v物 = 2d₁ ÷ t − v聲');
   const[d0,d1]=calcD(u,t);
   return R(f,[sv,`已知 ${useD0?'d₀':'d₁'} = ${F(x)} m，t = ${F(t)} s`,`v物 = ${F(u)} m/s`,`驗算：d₀ = ${F(d0)} m，d₁ = ${F(d1)} m`],`物體速度 v物 = ${F(u)} m/s`,why,null,dia(d0,d1,v*t,u*t))}
  if(m==='mT'){const x0=g('d0','發聲瞬間距離 d₀'),u=g('u','物體速度 v物','zero');chk(u);const t=2*x0/(ap?v+u:v-u),d1=ap?x0-u*t:x0+u*t;
   let rc;if(!ap)rc='遠離障礙物，不會抵達。';else if(u===0)rc='物體不動，不會抵達。';else rc=`若維持等速，發聲後 ${F(x0/u)} s 抵達障礙物（比聽到回聲的 ${F(t)} s 晚）。`;
   return R(ap?'2d₀ = (v聲 + v物)t → t = 2d₀ ÷ (v聲 + v物)':'2d₀ = (v聲 − v物)t → t = 2d₀ ÷ (v聲 − v物)',[sv,`t = 2 × ${F(x0)} ÷ (${F(v)} ${k0} ${F(u)}) = ${F(t)} s`,`聽到回聲時距離 d₁ = ${F(d1)} m`,ap&&u>0?`抵達時間 = d₀ ÷ v物 = ${F(x0)} ÷ ${F(u)} = ${F(x0/u)} s`:'抵達時間：不適用'],`回聲時間 t = ${F(t)} s。${rc}`,why,null,dia(x0,d1,v*t,u*t))}
  const t1=g('t','第一次回聲時間 t₁'),t2=g('t2','第二次回聲時間 t₂'),D=g('tg','發聲間隔 Δt'),dl=ap?t1-t2:t2-t1;
  if(dl<=0)throw Error(ap?'朝向障礙物時，第二次回聲時間 t₂ 應小於 t₁（愈近愈快回來）':'遠離障礙物時，第二次回聲時間 t₂ 應大於 t₁');
  const den=ap?2*D-dl:2*D+dl;if(den<=0)throw Error('t₁、t₂ 與 Δt 不相容（|t₁ − t₂| 須小於 2Δt），請檢查數值');
  const u=v*dl/den;chk(u);const[e1,r1]=calcD(u,t1),[e2]=calcD(u,t2),ds=Math.abs(e1-e2),dh=D*(ap?1-u/v:1+u/v);
  return R(ap?'u = v聲(t₁ − t₂) ÷ [2Δt − (t₁ − t₂)]':'u = v聲(t₂ − t₁) ÷ [2Δt + (t₂ − t₁)]',[sv,`兩次發聲各滿足 d = (v聲 ${k0} v物)t ÷ 2，且兩次發聲位置相差 v物·Δt，聯立解出 v物`,`v物 = ${F(v)} × ${F(dl)} ÷ ${F(den)} = ${F(u)} m/s`,`第一次發聲距離 = ${F(e1)} m；第二次發聲距離 = ${F(e2)} m`,`兩次發聲位置距離差 = ${F(ds)} m（= v物·Δt）`,`兩次聲音抵達障礙物的時間差 = Δt × (1 ${k1} v物/v聲) = ${F(dh)} s`],`平均速度 v物 = ${F(u)} m/s；距離差 ${F(ds)} m；發聲間隔 ${F(D)} s，反射時間差 ${F(dh)} s`,'兩次回聲時間的差，反映了物體在這段時間拉近（或拉遠）的距離。',null,dia(e1,r1,v*t1,u*t1))},
 talk:'畫線段圖：A 發聲、C 是牆、B 聽到回聲。聲音走 A→C→B，物體走 A→B。找誰走得遠，加起來湊成兩個距離：朝向時（聲音路程 + 物體位移）= 2d₀，遠離時（聲音路程 − 物體位移）= 2d₀。',
 pit:'① <span class="hl">先看清楚題目問的是「發聲時」還是「聽到回聲時」的距離（d₀ 與 d₁ 不同！）</span>② 朝向用 v聲 + v物 得 d₀，遠離用 v聲 − v物 得 d₀，別弄反。③ 忘記除以 2。④ v物 ≥ v聲 時不會有一般回聲。⑤ ms、km/h 要先換成 s、m/s。'},
{cat:'w',title:'4 聲音三要素判別',kw:'響度 音調 音色 弦樂 管樂 振幅 頻率',
 fields:[{k:'mode',l:'判別類型',sel:[['basic','波形對照三要素'],['str','弦樂器'],['air','管樂器']]},{k:'amp',l:'振幅',sel:[['1','較大'],['0','較小']],m:'basic'},{k:'freq',l:'頻率',sel:[['1','較高'],['0','較低']],m:'basic'},{k:'shape',l:'波形',sel:[['same','相同'],['diff','不同']],m:'basic'},{k:'len',l:'弦長',sel:[['0','相同'],['1','較短'],['-1','較長']],m:'str'},{k:'th',l:'粗細',sel:[['0','相同'],['1','較細'],['-1','較粗']],m:'str'},{k:'te',l:'鬆緊',sel:[['0','相同'],['1','較緊'],['-1','較鬆']],m:'str'},{k:'al',l:'空氣柱長度',sel:[['1','較短'],['-1','較長']],m:'air'}],
 ex:{mode:'str',len:'1',th:'0',te:'1'},
 calc(g,m){
  if(m==='basic'){const a=g('amp')==='1',f=g('freq')==='1',w=g('shape')==='same';return R('響度 ↔ 振幅；音調 ↔ 頻率；音色 ↔ 波形',[`振幅${a?'大':'小'} → 響度${a?'大':'小'}`,`頻率${f?'高':'低'} → 音調${f?'高':'低'}`,`波形${w?'相同 → 音色相同':'不同 → 音色不同'}`],`響度${a?'大':'小'}、音調${f?'高':'低'}、音色${w?'相同':'不同'}`,'三個要素各對應波的一個特徵，互不影響。')}
  const ks=m==='str'?[['len','長度','短'],['th','粗細','細'],['te','鬆緊','緊']]:[['al','空氣柱','短']];let up=0,dn=0;const s=[];
  ks.forEach(([k,n,w])=>{const v=+g(k);if(v>0){up++;s.push(`${n}：${w} → 音調變高`)}else if(v<0){dn++;s.push(`${n}：與「${w}」相反 → 音調變低`)}else s.push(`${n}：相同 → 無影響`)});
  const a=up&&dn?'同時有升高與降低的因素，無法判斷（需控制變因）':up?'音調較高':dn?'音調較低':'音調相同';
  return R(m==='str'?'弦越短、越細、越緊 → 頻率越高 → 音調越高':'空氣柱越短 → 頻率越高 → 音調越高',s,a,'比較時一次只改變一個條件。')},
 talk:'喇叭「大聲」是振幅大，「尖」是頻率高，「是小提琴不是笛子」是波形不同。',
 pit:'① 把響度與音調混為一談。② 管樂器是「空氣柱」短音調高，不是管子材質。③ 音調高不代表聲音大。'},
{cat:'o',title:'5 針孔成像計算器',kw:'針孔 像高 放大率 倒立 暗室',
 fields:[{k:'h',l:'物高 h',un:LC},{k:'p',l:'物距 p',un:LC},{k:'q',l:'像距 q',un:LC},{k:'sz',l:'針孔大小',sel:[['s','小'],['l','大']]}],
 ex:{h:20,p:60,q:30,sz:'s'},
 calc(g){const h=g('h','物高'),p=g('p','物距'),q=g('q','像距'),m=q/p,hi=h*m,s=g('sz')==='s';
  return R('像高 / 物高 = 像距 / 物距（相似三角形）',['（已換算為 cm）',`m = q ÷ p = ${F(q)} ÷ ${F(p)} = ${F(m)}`,`像高 = ${F(h)} × ${F(m)} = ${F(hi)} cm`],`像高 ${F(hi)} cm，放大率 ${F(m)} 倍；上下左右皆顛倒的倒立實像。`,s?'孔小：進光少所以較暗，但像清晰。':'孔大：進光多所以較亮，但像模糊。')},
 talk:'光走直線，通過小孔時，上面來的光跑到下面、左邊來的跑到右邊，所以像整個轉了 180°。',
 pit:'① 只說「上下顛倒」，漏了左右也顛倒。② 孔越大越清楚是錯的（越亮但越模糊）。③ 針孔成像是實像，可以用屏幕接到。'},
{cat:'o',title:'6 光的反射與平面鏡成像',kw:'反射 平面鏡 入射角 鏡長 雙鏡 像數',
 fields:[{k:'mode',l:'子題',sel:[['ang','入射角／反射角換算'],['dist','人與像距離、相對速度'],['full','看全身最小鏡長'],['two','雙平面鏡像數']]},{k:'ang',l:'角度（度）',m:'ang'},{k:'ty',l:'此角度是',sel:[['i','入射角'],['s','與鏡面夾角']],m:'ang'},{k:'d',l:'人到鏡距離（m）',m:'dist'},{k:'vv',l:'人移動速率（m/s）',m:'dist'},{k:'H',l:'身高 H',un:LC,m:'full'},{k:'e',l:'眼睛高度 e',un:LC,m:'full'},{k:'th',l:'兩鏡夾角（度）',m:'two'}],
 ex:{mode:'full',H:160,e:150},
 calc(g,m){
  if(m==='ang'){const a=g('ang','角度','zero'),i=g('ty')==='i'?a:90-a;if(a>90)throw Error('角度需在 0°～90° 之間');return R('反射角 = 入射角；入射角 + 與鏡面夾角 = 90°',[`入射角 = ${F(i)}°`,`反射角 = ${F(i)}°`,`光線與鏡面夾角 = 90° − ${F(i)}° = ${F(90-i)}°`,`入射線與反射線夾角 = ${F(2*i)}°`],`入射角 = 反射角 = ${F(i)}°`,'角度一律從法線量起。')}
  if(m==='dist'){const d=g('d','距離'),v=g('vv','速率','zero');return R('像距 = 物距；相對速度 = 2 × 人速',[`人與像相距 = 2 × ${F(d)} = ${F(2*d)} m`,`人以 ${F(v)} m/s 靠近鏡子 → 像也以 ${F(v)} m/s 靠近鏡子`,`人與像相對速度 = 2 × ${F(v)} = ${F(2*v)} m/s`],`距離 ${F(2*d)} m；相對速度 ${F(2*v)} m/s`,'像和人各走一份，所以相對速度是兩倍。')}
  if(m==='full'){const H=g('H','身高'),e=g('e','眼高');if(e>=H)throw Error('眼睛高度需小於身高');return R('最小鏡長 = H ÷ 2；鏡底高 = e ÷ 2；鏡頂高 = (H + e) ÷ 2',['（已換算為 cm）',`鏡長 = ${F(H)} ÷ 2 = ${F(H/2)} cm`,`鏡底離地 = ${F(e)} ÷ 2 = ${F(e/2)} cm`,`鏡頂離地 = (${F(H)} + ${F(e)}) ÷ 2 = ${F((H+e)/2)} cm`],`最小鏡長 ${F(H/2)} cm，鏡底離地 ${F(e/2)} cm`,'鏡長與離鏡遠近無關。')}
  const th=g('th','夾角');if(th>180)throw Error('夾角需 ≤ 180°');const k=360/th;if(Math.abs(k-Math.round(k))>1e-6)throw Error('本工具僅處理 360° ÷ 夾角為整數的情況');
  return R('像數 N = 360° ÷ θ − 1',[`N = 360 ÷ ${F(th)} − 1 = ${F(Math.round(k)-1)}`],`共成 ${F(Math.round(k)-1)} 個像`,'夾角越小，像越多。')},
 talk:'平面鏡像「藏」在鏡後等距處，像是虛像：光線反向延長才相交，屏幕接不到。',
 pit:'① 角度量到鏡面而不是法線。② 看全身鏡長要「身高一半」，與距離無關。③ 相對速度是 2v，不是 v。④ 眼高與鏡底的算法常用錯（用 e/2）。'},
{cat:'o',title:'7 光的折射與視深判別',kw:'折射 視深 法線 空氣 水 玻璃 全反射',
 fields:[{k:'n1',l:'入射介質',sel:[['1','空氣 n=1.00'],['1.33','水 n=1.33'],['1.5','玻璃 n=1.50']]},{k:'n2',l:'折射介質',sel:[['1.33','水 n=1.33'],['1.5','玻璃 n=1.50'],['1','空氣 n=1.00']]},{k:'a',l:'入射角（度）'},{k:'h',l:'深度／高度 h（可留空）',un:LC}],
 ex:{n1:'1',n2:'1.33',a:45,h:100},
 calc(g){const n1=+g('n1'),n2=+g('n2'),a=g('a','入射角','zero'),h=g('h','深度','opt');if(a>=90)throw Error('入射角需小於 90°');
  const sr=n1*Math.sin(a*deg)/n2,s=[`n₁ sin i = n₂ sin r → sin r = ${F(n1)} × sin ${F(a)}° ÷ ${F(n2)} = ${F(sr)}`];let ans,mean;
  if(sr>1){ans='sin r > 1：發生全反射，沒有折射光';mean='光由光密入光疏且入射角夠大時才會全反射。'}
  else{const r=Math.asin(sr)/deg;ans=`折射角 r = ${F(r)}°，`+(n1===n2?'不偏折':r<a?'偏向法線（r < i）':'偏離法線（r > i）');mean='進入折射率較大的介質 → 偏向法線；進入較小的 → 偏離法線。'}
  if(h!==null){s.push(`空氣中看水中：視深 = h ÷ 1.33 = ${F(h/1.33)}（看起來較淺）`,`水中看空氣：視高 = h × 1.33 = ${F(h*1.33)}（看起來較高）`)}
  return R('n₁ sin i = n₂ sin r（斯乃耳定律）',s,ans,mean)},
 talk:'光像車子從柏油路開進泥地：速度變慢，車頭轉向法線；反過來則轉離法線。看水中的魚，眼睛「以為」光是直線來的，所以魚看起來比較淺。',
 pit:'① 折射角量到「法線」而非界面。② 水中看岸上是看起來較高，不是較低。③ 垂直入射不偏折但速度仍改變。'},
{cat:'o',title:'8 凸透鏡與凹透鏡成像判讀器',kw:'凸透鏡 凹透鏡 焦距 物距 像距 實像 虛像 放大率',
 fields:[{k:'type',l:'透鏡種類',sel:[['convex','凸透鏡'],['concave','凹透鏡']]},{k:'f',l:'焦距 f',un:LC},{k:'p',l:'物距 p',un:LC}],
 ex:{type:'convex',f:10,p:15},
 calc(g){const ty=g('type'),f=g('f','焦距'),p=g('p','物距'),r=lens(ty,f,p);
  const f0=ty==='convex'?f:-f;
  const s=['（已換算為 cm；凸透鏡 f 取正、凹透鏡 f 取負）',`f = ${F(f0)}`];
  if(r.none)return R('1/p + 1/q = 1/f',s,r.items[0],'物體放在焦點，光線平行射出，眼睛需放鬆看遠處也看不到像。');
  s.push(`1/q = 1/f − 1/p = 1/(${F(f0)}) − 1/${F(p)}`,`q = ${F(r.q)} cm（正：異側實像；負：同側虛像）`,`m = −q ÷ p = ${F(r.m)}`);
  return R('1/p + 1/q = 1/f；m = −q/p',s,r.items.join('；'),r.mv)},
 talk:'凸透鏡像放大鏡：貼很近（p<f）看到正立放大；拉遠過焦點，像突然倒過來。凹透鏡永遠只給你縮小正立的虛像。',
 pit:'① p = f 時不能算 q（會除以 0），應回答「不成像」。② 虛像的 q 是負號，不是算錯。③ 實像一定倒立、虛像一定正立（單一透鏡）。④ 凹透鏡的 f 要取負。'},
{cat:'o',title:'9 視力矯正與色光／物體顏色',kw:'近視 遠視 色光 混色 濾光片 顏色 三原色',
 fields:[{k:'mode',l:'子題',sel:[['eye','視力矯正'],['mix','色光混色'],['obj','物體顏色／濾光片']]},{k:'kind',l:'視力問題',sel:[['m','近視'],['h','遠視']],m:'eye'},{k:'cr',l:'紅光',sel:[['1','開'],['0','關']],m:'mix'},{k:'cg',l:'綠光',sel:[['1','開'],['0','關']],m:'mix'},{k:'cb',l:'藍光',sel:[['1','開'],['0','關']],m:'mix'},{k:'lt',l:'入射色光',sel:[[7,'白光'],[4,'紅光'],[2,'綠光'],[1,'藍光'],[6,'黃光'],[3,'青光'],[5,'品紅光']],m:'obj'},{k:'mt',l:'物體種類',sel:[['o','不透明物體'],['f','濾光片']],m:'obj'},{k:'ob',l:'物體／濾光片顏色',sel:[[7,'白色'],[4,'紅色'],[2,'綠色'],[1,'藍色'],[6,'黃色'],[3,'青色'],[5,'品紅色'],[0,'黑色']],m:'obj'}],
 ex:{mode:'obj',lt:'6',mt:'o',ob:'4'},
 calc(g,m){
  if(m==='eye'){const my=g('kind')==='m';return R(my?'近視：折射太強或眼球太長':'遠視：折射太弱或眼球太短',[my?'遠處物體的像成在視網膜「前方」':'近處物體的像成在視網膜「後方」',my?'需讓光線先發散一些 → 配戴凹透鏡':'需讓光線先會聚一些 → 配戴凸透鏡'],my?'近視：像在視網膜前，戴凹透鏡':'遠視：像在視網膜後，戴凸透鏡','配戴的透鏡要把像「拉」回視網膜上。')}
  if(m==='mix'){const x=4*+g('cr')+2*+g('cg')+ +g('cb');return R('紅 + 綠 = 黃；綠 + 藍 = 青；紅 + 藍 = 品紅；紅 + 綠 + 藍 = 白',[`開啟：${[+g('cr')?'紅':'',+g('cg')?'綠':'',+g('cb')?'藍':''].join('')||'無'}`],`混合結果：${CN[x]}`,'色光是「加法」混色，越混越亮。',CH[x])}
  const L=+g('lt'),O=+g('ob'),x=L&O;
  return R('物體只反射（濾光片只讓通過）與自己同色的色光，其餘吸收',[`${CN[L]===CN[7]?'白':CN[L].replace('色','')}光 含：${CN[L]}成分`,`${g('mt')==='o'?'物體反射':'濾光片通過'}：${CN[O]}成分`,`兩者交集 → ${CN[x]}`],`眼睛看到：${CN[x]}${x===0?'（全被吸收）':''}`,'紅物體在綠光下看起來是黑的，因為綠光被吸收、沒有紅光可反射。',CH[x])},
 talk:'把色光想成三種顏色的球，物體像篩子：紅色物體只讓紅球彈回來，其他球都吞掉。',
 pit:'① 色光混色（加法）與顏料混色（減法）不同。② 黃光不是單一色光，是紅綠混合。③ 近視戴凹透鏡、遠視戴凸透鏡，口訣「近凹遠凸」。'}
];

/* 渲染題型卡片 */
const fieldHTML=f=>{
 const body=f.sel?`<select data-k="${f.k}">${f.sel.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`:`<div class="fi"><input data-k="${f.k}" type="number" step="any" inputmode="decimal">${f.un?`<select data-u="${f.k}" style="width:auto">${f.un.map(u=>`<option value="${u[1]}">${u[0]}</option>`).join('')}</select>`:''}</div>`;
 return `<label class="f" ${f.m?`data-m="${f.m}"`:''}>${f.l}${body}</label>`};
function mk(t){
 const d=document.createElement('details');d.className='card';d.dataset.cat=t.cat;d.dataset.kw=(t.title+t.kw).toLowerCase();
 d.innerHTML=`<summary><span>${t.title}</span><span style="font-weight:400;font-size:13px">${t.cat==='w'?'波動與聲學':'光學與色彩'}</span></summary><div class="in"><div class="g">${t.fields.map(fieldHTML).join('')}</div>
 <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn ex">帶入範例題</button>${(t.exs||[]).map((e,i)=>`<button class="btn ex2" data-i="${i}">${e.n}</button>`).join('')}<button class="btn tg">隱藏解答</button></div>
 <div class="res">輸入條件，或點「帶入範例題」。</div>${t.extra||''}
 <div class="note"><b>白話口語講解</b><br>${t.talk}</div><div class="note"><b>常見迷思與易錯陷阱</b><br>${t.pit}</div></div>`;
 const res=$('.res',d),modeEl=$('[data-k=mode]',d);
 const vis=()=>{const m=modeEl?modeEl.value:'';$$('[data-m]',d).forEach(l=>l.style.display=l.dataset.m.split(',').includes(m)?'':'none')};
 const g=(k,l,o)=>{const el=$(`[data-k="${k}"]`,d);let v=el.value;if(el.tagName==='SELECT')return v;
  if(v===''){if(o==='opt')return null;throw Error(`請輸入「${l}」`)}
  if(isNaN(+v))throw Error(`「${l}」需為數字`);v=+v;const u=$(`[data-u="${k}"]`,d);if(u)v*=+u.value;
  if(o==='neg')return v;if(v<0||(v===0&&o!=='zero'))throw Error(`「${l}」必須${o==='zero'?'不可為負值':'大於 0'}`);return v};
 const upd=()=>{vis();try{const r=t.calc(g,modeEl?modeEl.value:'');
  res.innerHTML=`${r.svg||''}<div><b>① 使用公式</b><br>${r.f}</div><div style="margin-top:8px"><b>② 單位換算與代入</b><br>${r.s.join('<br>')}</div><div style="margin-top:8px"><b>③ 最終答案與物理意義</b><br><span class="ans">${r.sw?`<span class="sw" style="background:${r.sw}"></span>`:''}${r.a}</span><br>${r.m}</div>`}
  catch(e){res.innerHTML=`<span class="err">${e.message}</span>`}};
 d.addEventListener('input',upd);d.addEventListener('change',upd);
 const fill=ex=>{$$('[data-u]',d).forEach(u=>u.selectedIndex=0);$$('[data-k]',d).forEach(el=>{el.value=ex[el.dataset.k]!==undefined?ex[el.dataset.k]:(el.tagName==='SELECT'?el.options[0].value:'')});upd()};
 $('.ex',d).onclick=()=>fill(t.ex);$$('.ex2',d).forEach(b=>b.onclick=()=>fill(t.exs[+b.dataset.i].v));
 const tg=$('.tg',d);tg.onclick=()=>{const v=res.classList.toggle('veil');tg.textContent=v?'顯示解答':'隱藏解答'};
 vis();return d}
T.forEach((t,i)=>{const c=mk(t);if(!i)c.open=true;$('#list').appendChild(c)});

$('#kw').oninput=filt;

/* Canvas 共用 */
function setup(c,W,H){const r=Math.min(devicePixelRatio||1,2);c.width=W*r;c.height=H*r;const x=c.getContext('2d');x.setTransform(r,0,0,r,0,0);return x}
const lineTo=(x,a,b,c,d,col,dash,w)=>{x.beginPath();x.setLineDash(dash||[]);x.strokeStyle=col;x.lineWidth=w||1.5;x.moveTo(a,b);x.lineTo(c,d);x.stroke();x.setLineDash([])};
function arrow(x,px,y0,y1,col,dash){lineTo(x,px,y0,px,y1,col,dash,2);const s=y1<y0?1:-1;x.beginPath();x.fillStyle=col;x.moveTo(px,y1);x.lineTo(px-5,y1+s*9);x.lineTo(px+5,y1+s*9);x.fill()}

/* 動態波動模擬器 */
(()=>{const W=700,H=280,c=$('#wc'),x=setup(c,W,H),S={A:$('#wA'),f:$('#wF'),v:$('#wV')};let t=0,run=true,last=0;
 const draw=()=>{const ac=css('--ac'),tx=css('--tx'),hd=css('--hd'),no=css('--no'),A=+S.A.value,f=+S.f.value,v=+S.v.value,L=v/f,pm=100,Lp=L*pm,cy=140,am=A*pm;
  $('#wAo').textContent=A.toFixed(1)+' m';$('#wFo').textContent=f.toFixed(1)+' Hz';$('#wVo').textContent=v.toFixed(1)+' m/s';
  x.clearRect(0,0,W,H);lineTo(x,0,cy,W,cy,css('--bd'),[4,4],1);
  x.beginPath();x.strokeStyle=ac;x.lineWidth=2.5;for(let i=0;i<=W;i+=3){const y=cy-am*Math.sin(2*Math.PI*(f*t-i/Lp));i?x.lineTo(i,y):x.moveTo(i,y)}x.stroke();
  x.font='12px Inter,"Noto Sans TC"';x.fillStyle=tx;
  let x0=Lp*(((f*t-.25)%1+1)%1);if(x0<30)x0+=Lp;
  x.fillStyle=hd;x.beginPath();x.arc(x0,cy-am,4,0,7);x.fill();x.fillText('波峰',x0-12,cy-am-10);
  const xv=x0-Lp/2>20?x0-Lp/2:x0+Lp/2;x.beginPath();x.arc(xv,cy+am,4,0,7);x.fill();x.fillText('波谷',xv-12,cy+am+18);
  if(x0+Lp<W-10){lineTo(x,x0,cy-am-24,x0+Lp,cy-am-24,no,[],1.5);x.fillStyle=no;x.fillText('λ = '+F(L)+' m',x0+Lp/2-30,cy-am-30)}
  const xq=W/2,ph=2*Math.PI*(f*t-xq/Lp),yq=cy-am*Math.sin(ph),up=Math.cos(ph)>=0;
  lineTo(x,xq,cy-am,xq,cy+am,tx,[3,4],1);x.fillStyle=no;x.beginPath();x.arc(xq,yq,6,0,7);x.fill();
  arrow(x,xq+18,yq+(up?10:-10),yq+(up?-22:22),no);x.fillStyle=tx;x.fillText('質點只上下振動',xq+26,yq+4);
  $('#wi').innerHTML=`λ = v ÷ f = ${F(L)} m；T = 1 ÷ f = ${F(1/f)} s；質點現在向${up?'上':'下'}運動。`};
 const loop=ts=>{const dt=Math.min((ts-last)/1000,.1);last=ts;if(run&&$('#s2').classList.contains('on'))t+=dt;if($('#s2').classList.contains('on'))draw();requestAnimationFrame(loop)};
 $('#wp').onclick=e=>{run=!run;e.target.textContent=run?'暫停':'播放'};$('#wr').onclick=()=>{t=0;draw()};
 Object.values(S).forEach(s=>s.oninput=draw);requestAnimationFrame(loop)})();

/* 透鏡成像光路模擬器 */
(()=>{const W=700,H=300,c=$('#lc'),x=setup(c,W,H),lx=350,cy=150,ho=45;let f=60,p=150,drag=null;
 const lt=$('#lt'),sf=$('#lf'),sp=$('#lp');
 const draw=()=>{const ac=css('--ac'),tx=css('--tx'),hd=css('--hd'),ty=lt.value,cv=ty==='convex';f=+sf.value;p=+sp.value;
  $('#lfo').textContent=f;$('#lpo').textContent=p;x.clearRect(0,0,W,H);
  lineTo(x,0,cy,W,cy,css('--bd'),[],1);x.font='12px Inter,"Noto Sans TC"';x.fillStyle=tx;
  [[-f,'F'],[f,'F′'],[-2*f,'2F'],[2*f,'2F′']].forEach(([d,n])=>{lineTo(x,lx+d,cy-5,lx+d,cy+5,tx,[],1.5);x.fillText(n,lx+d-8,cy+20)});
  lineTo(x,lx,cy-110,lx,cy+110,hd,[],2);[-1,1].forEach(s=>{const e=cv?1:-1;[cy-110,cy+110].forEach((y,i)=>{const d=i?-1:1;lineTo(x,lx,y,lx+s*7,y+d*e*10,hd,[],2)})});
  const xo=lx-p,yt=cy-ho;arrow(x,xo,cy,yt,hd);x.fillStyle=tx;x.fillText('物',xo-6,cy+34);
  const r=lens(ty,f,p),cols=['#F59E0B',ac,'#34D399'],rays=[];
  rays.push({h:yt,dx:cv?f:f,dy:cv?cy-yt:yt-cy});
  rays.push({h:cy,dx:lx-xo,dy:cy-yt});
  if(!(cv&&Math.abs(p-f)<1e-6)){const h3=cv?cy+(yt-cy)/(f-p)*f:yt+(cy-yt)/(f+p)*p;rays.push({h:h3,dx:1,dy:0})}
  rays.forEach((a,i)=>{const col=cols[i];lineTo(x,xo,yt,lx,a.h,col,[],1.5);const k=(W-lx)/a.dx;lineTo(x,lx,a.h,W,a.h+a.dy*k,col,[],1.5);});
  if(!r.none){const xi=lx+r.q,hi=(-r.q/p)*ho,yi=cy-hi;
   if(!r.real)rays.forEach((a,i)=>lineTo(x,lx,a.h,xi,yi,cols[i],[5,4],1.2));
   if(xi>=0&&xi<=W){arrow(x,xi,cy,yi,r.real?ac:tx,!r.real);x.fillStyle=tx;x.fillText('像',xi-6,cy+34)}}
  $('#li').innerHTML=(r.items.concat(r.mv||[])).join('<br>')};
 const pos=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*W/b.width,(e.clientY-b.top)*H/b.height]};
 c.onpointerdown=e=>{const[px,py]=pos(e);c.setPointerCapture(e.pointerId);drag=(Math.abs(Math.abs(px-lx)-f)<18&&Math.abs(py-cy)<30)?'f':'p';mv(e)};
 const mv=e=>{if(!drag)return;const[px]=pos(e);if(drag==='f')sf.value=Math.max(20,Math.min(100,Math.round(Math.abs(px-lx))));else sp.value=Math.max(20,Math.min(300,Math.round(lx-px)));draw()};
 c.onpointermove=mv;c.onpointerup=c.onpointercancel=()=>drag=null;
 [lt,sf,sp].forEach(el=>el.oninput=draw);lt.onchange=draw;draw();
 $$('#tabs button').forEach(b=>b.addEventListener('click',draw))})();

/* 隨堂練習 */
function numQ(q,ans,u,w,c,x=[]){ans=+ans.toFixed(2);const s=new Set([ans]);[...x,ans*2,ans/2,ans*3,ans+1,ans+5,ans+10,Math.abs(ans-1),ans*4].forEach(v=>{v=+v.toFixed(2);if(v>0&&s.size<4)s.add(v)});const o=shuf([...s]);return{q,o:o.map(v=>F(v)+u),a:o.indexOf(ans),w,c}}
function conQ(q,o,a,w,c){const z=shuf(o.map((v,i)=>[v,i]));return{q,o:z.map(v=>v[0]),a:z.findIndex(v=>v[1]===a),w,c}}
const CQ=[
['w','下列何者決定聲音的「音調」？',['振幅','頻率','波形','波速'],1,'音調看頻率；振幅決定響度，波形決定音色。'],
['w','關於聲音的傳播，何者正確？',['真空中傳得最快','固體中通常比空氣中快','與溫度無關','是橫波'],1,'聲音需要介質；固體通常快於氣體；溫度高聲速較快；空氣中為縱波。'],
['w','弦越短、越細、越緊，音調會？',['越低','越高','不變','無法判斷'],1,'頻率越高，音調越高。'],
['w','波傳播時，介質質點會？',['隨波移動到遠方','在原位置附近振動','速度等於波速','不會動'],1,'波傳遞的是能量與形狀，質點只在原位附近振動。'],
['o','光從空氣斜射入水中，折射光線會？',['偏離法線','偏向法線','不偏折','全反射'],1,'進入折射率較大的介質（水）→ 偏向法線。'],
['o','人在平面鏡前，所成的像是？',['倒立實像','正立虛像','倒立虛像','正立實像'],1,'平面鏡成正立、等大、左右相反的虛像，像距等於物距。'],
['o','針孔成像的像是？',['正立虛像','倒立實像','正立實像','倒立虛像'],1,'光走直線，上下左右皆顛倒，可由屏幕承接，為實像。'],
['o','近視眼應配戴？',['凸透鏡','凹透鏡','平面鏡','三稜鏡'],1,'近視像成在視網膜前，需凹透鏡（近凹遠凸）。'],
['o','物體放在凸透鏡一倍焦距內，成像為？',['倒立實像','正立放大虛像','倒立縮小實像','不成像'],1,'p < f 時為正立、放大、同側虛像（放大鏡原理）。'],
['o','從岸上看水中的魚，魚看起來比實際？',['較深','較淺','一樣深','不一定'],1,'視深 = 實深 ÷ 1.33，所以看起來較淺。'],
['o','凹透鏡成像永遠是？',['正立縮小虛像','倒立縮小實像','倒立放大實像','正立放大虛像'],0,'凹透鏡使光發散，任意物距都成正立縮小虛像。']];
const LP=[[30,10,15],[20,10,20],[15,10,30],[40,20,40],[60,20,30],[30,15,30]];
const GW=[
()=>{const f=pick([2,5,10,20,50]),L=pick([.5,1,2,4]);return numQ(`波的頻率 ${f} Hz、波長 ${L} m，波速為多少？`,f*L,' m/s',`v = fλ = ${f} × ${L} = ${f*L} m/s`,'w')},
()=>{const f=pick([2,4,5,10,20,25,50]);return numQ(`頻率 ${f} Hz 的波，週期為多少秒？`,1/f,' s',`T = 1 ÷ f = 1 ÷ ${f} = ${F(1/f)} s`,'w')},
()=>{const t=pick([.4,.6,1,1.5,2]);return numQ(`氣溫 15℃（聲速 340 m/s），對山壁發聲後 ${t} 秒聽到回聲，距離山壁多少 m？`,340*t/2,' m',`d = vt ÷ 2 = 340 × ${t} ÷ 2 = ${F(340*t/2)} m（記得除以 2）`,'w')},
()=>{const u=pick([10,20]),t=pick([2,4]),ap=Math.random()<.5,k=Math.random()<.5,d0=((ap?340+u:340-u)*t)/2,d1=((ap?340-u:340+u)*t)/2;return numQ(`${ap?'船駛向懸崖':'車遠離山壁'}，速率 ${u} m/s，鳴笛後 ${t} 秒聽到回聲（聲速 340 m/s）。${k?'鳴笛時':'聽到回聲時'}與障礙物的距離為多少 m？`,k?d0:d1,' m',`${ap?'聲音路程 + 物體位移 = 2d₀':'聲音路程 − 物體位移 = 2d₀'}：d₀ = ${F(d0)} m（發聲時），d₁ = ${F(d1)} m（聽到回聲時）。先看清題目問的是哪一個時刻。`,'w',[k?d1:d0])},
()=>{const u=pick([10,20]),t=2,d0=(340+u)*t/2;return numQ(`船朝向懸崖，鳴笛時距離懸崖 ${d0} m，${t} 秒後聽到回聲（聲速 340 m/s），船速為多少 m/s？`,u,' m/s',`2d₀ = (v聲 + v物)t → v物 = 2 × ${d0} ÷ ${t} − 340 = ${u} m/s`,'w',[2*d0/t])},
()=>{const q=pick(CQ.filter(a=>a[0]==='w'));return conQ(q[1],q[2],q[3],q[4],'w')}];
const GO=[
()=>{const h=pick([10,20,30]),p=pick([20,30,60]),k=pick([.5,1,2]);return numQ(`針孔成像：物高 ${h} cm、物距 ${p} cm、像距 ${p*k} cm，像高多少 cm？`,h*k,' cm',`像高 = 物高 × q/p = ${h} × ${p*k}/${p} = ${h*k} cm（倒立）`,'o')},
()=>{const d=pick([1,2,3,4,5]);return numQ(`你站在平面鏡前 ${d} m，你與鏡中的像相距多少 m？`,2*d,' m',`像距 = 物距 = ${d} m，所以人與像相距 2 × ${d} = ${2*d} m`,'o')},
()=>{const z=pick(LP);return numQ(`凸透鏡焦距 ${z[1]} cm，物體放在 ${z[0]} cm 處，像距為多少 cm？`,z[2],' cm',`1/q = 1/${z[1]} − 1/${z[0]} → q = ${z[2]} cm（實像，異側）`,'o')},
()=>{const L=pick([4,2,1,7]),O=pick([7,4,2,1,6,3,5]),r=L&O,o=[CN[r]];shuf(CN.filter(n=>n!==CN[r])).slice(0,3).forEach(n=>o.push(n));const z=shuf(o);return{q:`${CN[L]}光照在${CN[O]}物體上，看到什麼顏色？`,o:z,a:z.indexOf(CN[r]),w:`物體只反射與自己同色的色光：${CN[L]}與${CN[O]}的交集是${CN[r]}。`,c:'o'}},
()=>{const q=pick(CQ.filter(a=>a[0]==='o'));return conQ(q[1],q[2],q[3],q[4],'o')}];
let qc='all',cur=null,locked=false;
const stat=()=>{const s=store.get('phy_q',{n:0,c:0});$('#qs').textContent=`已答 ${s.n} 題，正確率 ${s.n?Math.round(s.c/s.n*100):0}%`};
function nextQ(){const g=qc==='w'?pick(GW):qc==='o'?pick(GO):pick(GW.concat(GO));cur=g();locked=false;$('#qfb').style.display='none';
 $('#qbox').innerHTML=`<h3 style="font-size:17px">${cur.q}</h3>`+cur.o.map((o,i)=>`<button class="btn opt tn" data-i="${i}">${'ABCD'[i]}. ${o}</button>`).join('');
 $$('.opt').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const i=+b.dataset.i,ok=i===cur.a,s=store.get('phy_q',{n:0,c:0});s.n++;if(ok)s.c++;store.set('phy_q',s);
  b.classList.add(ok?'good':'bad');$$('.opt')[cur.a].classList.add('good');const fb=$('#qfb');fb.style.display='block';
  fb.innerHTML=ok?`<span class="ok"><b>答對了！</b></span><br>${cur.w}`:`<span class="err"><b>答錯了。</b></span> 正確答案是 ${'ABCD'[cur.a]}。<br><b>詳解：</b>${cur.w}`;stat()})}
$$('[data-q]').forEach(b=>b.onclick=()=>{qc=b.dataset.q;$$('[data-q]').forEach(x=>x.classList.toggle('on',x===b));nextQ()});
$('#qn').onclick=nextQ;$('#qr').onclick=()=>{store.set('phy_q',{n:0,c:0});stat()};
